name: Production

on:
  push:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simple-pos-test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/simple-pos-test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/simple-pos-test
      PRISMA_DB_URL: postgresql://postgres:postgres@localhost:5432/simple-pos-test
      SKIP_ENV_VALIDATION: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint and Typecheck
        run: npm run check

      - name: Prepare test database
        run: npm run db:push

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy on Vercel
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Production
        run: vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}
